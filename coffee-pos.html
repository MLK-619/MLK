
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DAZE 360 | نظام نقاط بيع محل القهوة</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#ffffff;
  --bg2:#f7f6f4;
  --card:#ffffff;
  --card2:#f2f0ec;
  --card3:#e9e5df;
  --text:#0f0f10;
  --muted:#6b675f;
  --accent:#c9a15a;
  --accent-dark:#8a6a2f;
  --accent-light:#e3c184;
  --danger:#c0392b;
  --danger-tint:rgba(192,57,43,.1);
  --success:#1a8f4c;
  --success-tint:rgba(26,143,76,.1);
  --warning:#b9790f;
  --warning-tint:rgba(224,149,27,.12);
  --border:#e2ddd4;
  --accent-tint-06:rgba(138,106,47,.06);
  --accent-tint-10:rgba(138,106,47,.1);
  --accent-tint-16:rgba(138,106,47,.14);
  --accent-shadow-30:rgba(138,106,47,.3);
  --cat-1:#8a6a2f; --cat-2:#2f8fc0; --cat-3:#b5762a; --cat-4:#1f9d5d;
  --cat-5:#a4477b; --cat-6:#6c5ce7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  background:radial-gradient(circle at 15% 0%, var(--accent-tint-10), transparent 45%), linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;color:var(--text);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.hidden{display:none !important;}
.btn{
  border:none;border-radius:12px;padding:12px 18px;font-weight:700;font-size:.95rem;
  background:var(--card2);color:var(--text);transition:.15s;touch-action:manipulation;
}
.btn:active{transform:scale(.96);}
.btn-accent{background:linear-gradient(135deg,var(--accent-light),var(--accent));color:#1c1509;box-shadow:0 6px 18px var(--accent-shadow-30);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-outline{background:transparent;border:2px solid var(--border);}
.btn-sm{padding:8px 12px;font-size:.82rem;border-radius:9px;}
.btn-lg{padding:16px 22px;font-size:1.05rem;border-radius:14px;}
.btn:disabled{opacity:.45;pointer-events:none;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--card2);border:2px solid transparent;}
.pill.active{background:var(--accent);color:#fff;}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;}
.tag{padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;}
.tag.ok{background:var(--success-tint);color:var(--success);}
.tag.warn{background:var(--warning-tint);color:var(--warning);}
.tag.bad{background:var(--danger-tint);color:var(--danger);}

/* ===== Login ===== */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-wrap{max-width:780px;width:100%;text-align:center;}
.login-logo{font-size:3.2rem;margin-bottom:6px;}
.login-logo-img{height:76px;width:76px;object-fit:contain;border-radius:16px;}
.logo-upload-preview{height:56px;width:56px;object-fit:contain;border-radius:10px;border:1px solid var(--border);background:#fff;}
.login-title{font-size:1.7rem;font-weight:800;margin:0 0 4px;}
.login-sub{color:var(--muted);margin:0 0 30px;font-size:.95rem;}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:20px;}
.staff-card{
  background:var(--card);border:2px solid var(--border);border-radius:18px;padding:22px 12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:.15s;
}
.staff-card:active{transform:scale(.96);border-color:var(--accent-light);}
.staff-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent-light),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;}
.staff-name{font-weight:700;font-size:.95rem;}
.staff-role{font-size:.75rem;color:var(--muted);}
.pin-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.pin-box{background:var(--card);border-radius:24px;padding:32px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.25);}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:18px 0 24px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);}
.pin-dot.filled{background:var(--accent);}
.pin-dot.err{border-color:var(--danger);background:var(--danger);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.keypad button{
  padding:18px 0;border-radius:14px;border:none;background:var(--card2);font-size:1.3rem;font-weight:700;color:var(--text);
}
.keypad button:active{background:var(--accent-tint-16);}
.keypad .kp-del{background:var(--danger-tint);color:var(--danger);font-size:1rem;}
.pin-cancel{margin-top:16px;color:var(--muted);background:none;border:none;text-decoration:underline;font-size:.85rem;}

/* ===== App shell ===== */
#app{min-height:100vh;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 20px;background:var(--card);color:var(--text);
  border-bottom:2px solid var(--accent);
  box-shadow:0 2px 10px rgba(0,0,0,.06);flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;}
.brand .logo-emoji{font-size:1.5rem;}
.brand .logo-img{height:34px;width:34px;object-fit:contain;border-radius:8px;}
.order-type-switch{display:flex;gap:6px;background:var(--card2);padding:5px;border-radius:12px;}
.order-type-switch button{border:none;background:transparent;color:var(--text);padding:8px 14px;border-radius:9px;font-weight:700;font-size:.82rem;opacity:.6;}
.order-type-switch button.active{background:var(--accent);color:#1c1509;opacity:1;}
.top-right{display:flex;align-items:center;gap:12px;font-size:.85rem;}
.top-right .clock{font-weight:700;background:var(--card2);color:var(--text);padding:6px 12px;border-radius:9px;}
.staff-chip{background:var(--card2);color:var(--text);padding:6px 12px;border-radius:9px;font-weight:700;display:flex;align-items:center;gap:6px;}
.top-right button{background:var(--card2);border:none;color:var(--text);padding:8px 14px;border-radius:9px;font-weight:700;}

#body-wrap{flex:1;display:flex;min-height:0;}
#sidenav{
  width:88px;flex:none;background:var(--card);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;padding:12px 6px;gap:4px;overflow-y:auto;
}
#sidenav button{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border:none;
  background:transparent;border-radius:12px;color:var(--muted);font-size:.68rem;font-weight:700;
}
#sidenav button .nav-ic{font-size:1.35rem;}
#sidenav button.active{background:var(--accent-tint-16);color:var(--accent-dark);}
#view-root{flex:1;min-width:0;overflow-y:auto;padding:18px;}

/* ===== POS layout ===== */
.pos-layout{display:flex;gap:16px;height:100%;}
.pos-products{flex:1;min-width:0;display:flex;flex-direction:column;}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;}
.cat-tab{
  flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:2px solid var(--border);
  background:var(--card);font-weight:700;font-size:.85rem;white-space:nowrap;
}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#1c1509;}
.search-bar{margin-bottom:12px;}
.search-bar input{width:100%;padding:12px 16px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-size:.9rem;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start;}
.product-card{
  background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;
  transition:.12s;min-height:150px;justify-content:center;
}
.product-card:active{transform:scale(.95);}
.product-ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:var(--card2);}
.product-name{font-weight:700;font-size:.85rem;line-height:1.3;}
.product-price{color:var(--accent-dark);font-weight:800;font-size:.85rem;}
.product-card.unavailable{opacity:.5;}
.product-card.unavailable::after{content:attr(data-unavail);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);border-radius:16px;font-weight:800;color:var(--danger);font-size:.78rem;}

.pos-cart{
  width:360px;flex:none;background:var(--card);border-radius:18px;border:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.cart-header{padding:14px 16px;border-bottom:1px solid var(--border);}
.cart-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cart-title{font-weight:800;font-size:1rem;}
.cart-meta-row{display:flex;gap:8px;flex-wrap:wrap;}
.table-badge{background:var(--accent-tint-16);color:var(--accent-dark);padding:5px 12px;border-radius:9px;font-size:.78rem;font-weight:700;}
.cart-items{flex:1;overflow-y:auto;padding:8px 12px;min-height:80px;}
.cart-empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:.9rem;}
.cart-item{padding:10px 4px;border-bottom:1px dashed var(--border);display:flex;flex-direction:column;gap:6px;}
.cart-item-top{display:flex;justify-content:space-between;gap:8px;}
.cart-item-name{font-weight:700;font-size:.88rem;}
.cart-item-mods{font-size:.72rem;color:var(--muted);}
.cart-item-bottom{display:flex;justify-content:space-between;align-items:center;}
.qty-stepper{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:9px;padding:3px;}
.qty-stepper button{width:26px;height:26px;border-radius:7px;border:none;background:#fff;font-weight:800;}
.qty-stepper span{min-width:20px;text-align:center;font-weight:700;font-size:.85rem;}
.cart-item-price{font-weight:800;font-size:.85rem;color:var(--accent-dark);}
.cart-item-remove{background:none;border:none;color:var(--danger);font-size:.78rem;font-weight:700;}
.cart-summary{padding:12px 16px;border-top:1px solid var(--border);font-size:.85rem;}
.sum-row{display:flex;justify-content:space-between;padding:4px 0;}
.sum-row.total{font-size:1.15rem;font-weight:800;color:var(--accent-dark);border-top:1px solid var(--border);margin-top:6px;padding-top:10px;}
.cart-actions{display:flex;gap:8px;padding:12px 16px 16px;}
.cart-actions .btn{flex:1;}

/* ===== Tables ===== */
.tables-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;}
.table-card{
  background:var(--card);border:2px solid var(--border);border-radius:16px;padding:18px 10px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.table-card.free{border-color:var(--success);}
.table-card.occupied{border-color:var(--warning);background:var(--warning-tint);}
.table-num{font-size:1.6rem;font-weight:800;}
.table-status{font-size:.75rem;font-weight:700;}

/* ===== Generic cards / tables ===== */
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.section-title{font-size:1.25rem;font-weight:800;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;}
.kpi-label{color:var(--muted);font-size:.78rem;font-weight:700;margin-bottom:6px;}
.kpi-value{font-size:1.5rem;font-weight:800;color:var(--accent-dark);}
.data-table{width:100%;border-collapse:collapse;font-size:.85rem;}
.data-table th{text-align:start;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:2px solid var(--border);font-size:.78rem;}
.data-table td{padding:10px 8px;border-bottom:1px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.82rem;}
.bar-label{width:130px;flex:none;font-weight:700;}
.bar-track{flex:1;height:16px;background:var(--card2);border-radius:8px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-light),var(--accent));border-radius:8px;}
.bar-val{width:90px;flex:none;text-align:end;font-weight:700;color:var(--accent-dark);}
.alert-banner{background:var(--warning-tint);border:1px solid var(--warning);color:#7a5000;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:.85rem;font-weight:700;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--border);font-size:.9rem;background:var(--bg2);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.toggle{display:flex;align-items:center;gap:8px;}
.switch{position:relative;width:44px;height:24px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.2s;}
.slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .slider{background:var(--success);}
input:checked + .slider::before{transform:translateX(-20px);}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;}
.modal-box{background:var(--card);border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.3);}
.modal-box.wide{max-width:720px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;}
.modal-title{font-size:1.1rem;font-weight:800;}
.modal-close{background:var(--card2);border:none;width:32px;height:32px;border-radius:50%;font-size:1rem;}
.modal-body{padding:20px;}
.modal-foot{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);}
.modal-foot .btn{flex:1;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:9px 15px;border-radius:10px;border:2px solid var(--border);background:var(--bg2);font-weight:700;font-size:.85rem;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.modal-section{margin-bottom:16px;}
.modal-section-title{font-size:.8rem;font-weight:800;color:var(--muted);margin-bottom:8px;}
.qty-big{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0;}
.qty-big button{width:44px;height:44px;border-radius:12px;border:none;background:var(--card2);font-size:1.3rem;font-weight:800;}
.qty-big span{font-size:1.5rem;font-weight:800;min-width:36px;text-align:center;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent-dark);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;font-size:.85rem;z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .25s ease;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

/* ===== Receipt ===== */
#receipt-print{display:none;}
.receipt-preview{font-family:"Cairo",monospace;background:#fff;color:#111;padding:14px;border-radius:10px;border:1px dashed var(--border);font-size:.85rem;}
.receipt-preview .r-center{text-align:center;}
.receipt-preview hr{border:none;border-top:1px dashed #999;margin:8px 0;}
.receipt-line{display:flex;justify-content:space-between;font-size:.8rem;margin:2px 0;}
@media print{
  body *{visibility:hidden;}
  #receipt-print,#receipt-print *{visibility:visible;}
  #receipt-print{display:block;position:absolute;top:0;inset-inline-end:0;width:80mm;padding:6px;}
}

@media(max-width:1000px){
  .pos-layout{flex-direction:column;}
  .pos-cart{width:100%;}
}
@media(max-width:640px){
  #sidenav{width:64px;}
  #sidenav button{font-size:.6rem;padding:10px 2px;}
  #sidenav button .nav-ic{font-size:1.15rem;}
  .top-right .clock{display:none;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo" id="loginLogo">☕</div>
    <h1 class="login-title" id="loginTitle">DAZE 360</h1>
    <p class="login-sub" id="loginSub">نظام نقاط بيع محل القهوة — اختر اسمك لتسجيل الدخول</p>
    <div class="staff-grid" id="staffGrid"></div>
  </div>
</div>

<div class="pin-overlay hidden" id="pinOverlay">
  <div class="pin-box">
    <div style="font-weight:800;font-size:1.05rem;" id="pinStaffName"></div>
    <div style="color:var(--muted);font-size:.8rem;" id="pinPrompt">أدخل الرقم السري المكوّن من 4 أرقام</div>
    <div class="pin-dots" id="pinDots"></div>
    <div class="keypad" id="keypad"></div>
    <button class="pin-cancel" id="pinCancelBtn"></button>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <header id="topbar">
    <div class="brand"><span class="logo-emoji" id="brandLogo">☕</span><span id="brandName">DAZE 360</span><span id="brandBranch" class="staff-chip" style="margin-inline-start:8px;font-size:.72rem;font-weight:700;"></span></div>
    <div class="order-type-switch" id="orderTypeSwitch"></div>
    <div class="top-right">
      <span class="clock" id="clock"></span>
      <span class="staff-chip" id="staffChip"></span>
      <button id="logoutBtn"></button>
    </div>
  </header>
  <div id="body-wrap">
    <nav id="sidenav"></nav>
    <main id="view-root"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="receipt-print"></div>

<script>
/* ============================================================
   COFFEE POS — single-file tablet POS demo
   All data persisted in localStorage. No backend required.
   ============================================================ */

const LS_KEY = 'coffeepos_data_v1';
const SESSION_STAFF_KEY = 'coffeepos_staff_v1';
const SESSION_CART_KEY = 'coffeepos_cart_v1';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmt(n){ return (Math.round((n+Number.EPSILON)*100)/100).toFixed(2) + ' ' + state.settings.currency; }
function money(n){ return Math.round((n+Number.EPSILON)*100)/100; }

function pad(n){ return n<10 ? '0'+n : ''+n; }
const MONTH_NAMES = {
  ar:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
  en:['January','February','March','April','May','June','July','August','September','October','November','December']
};
function currentLang(){ return (state&&state.settings&&state.settings.language)||'ar'; }
function formatDateTime(ts){
  const d = new Date(ts);
  const lang = currentLang();
  const months = MONTH_NAMES[lang]||MONTH_NAMES.ar;
  let h = d.getHours(); const ampm = lang==='en'?(h>=12?'PM':'AM'):(h>=12?'م':'ص'); h = h%12; if(h===0) h=12;
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} - ${h}:${pad(d.getMinutes())} ${ampm}`;
}
function formatTime(ts){
  const d = new Date(ts);
  const lang = currentLang();
  let h = d.getHours(); const ampm = lang==='en'?(h>=12?'PM':'AM'):(h>=12?'م':'ص'); h = h%12; if(h===0) h=12;
  return `${h}:${pad(d.getMinutes())} ${ampm}`;
}
function formatDateShort(ts){
  const d = new Date(ts);
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}
function isSameDay(ts, ref){
  const a=new Date(ts), b=new Date(ref);
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }

function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('');
}
function roleLabel(role){ return role==='manager' ? t('role_manager') : t('role_cashier'); }
function renderStaffGrid(){
  const el = document.getElementById('staffGrid');
  el.innerHTML = state.staff.map(s=>`
    <button class="staff-card" data-staff="${s.id}">
      <div class="staff-avatar">${initials(L(s.name))}</div>
      <div class="staff-name">${L(s.name)}</div>
      <div class="staff-role">${roleLabel(s.role)}</div>
    </button>`).join('');
  el.querySelectorAll('.staff-card').forEach(btn=>{
    btn.addEventListener('click', ()=> openPinPad(btn.dataset.staff));
  });
}

let pinEntry = '';
let pinTargetStaff = null;
function openPinPad(staffId){
  pinTargetStaff = state.staff.find(s=>s.id===staffId);
  pinEntry = '';
  document.getElementById('pinStaffName').textContent = L(pinTargetStaff.name);
  renderPinDots();
  const kp = document.getElementById('keypad');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  kp.innerHTML = keys.map(k=>{
    if(k==='') return '<span></span>';
    if(k==='del') return '<button class="kp-del" data-k="del">⌫</button>';
    return `<button data-k="${k}">${k}</button>`;
  }).join('');
  kp.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.dataset.k==='del'){ pinEntry = pinEntry.slice(0,-1); }
      else if(pinEntry.length<4){ pinEntry += b.dataset.k; }
      renderPinDots();
      if(pinEntry.length===4) checkPin();
    });
  });
  document.getElementById('pinOverlay').classList.remove('hidden');
}
function renderPinDots(err){
  const el = document.getElementById('pinDots');
  el.innerHTML = Array.from({length:4},(_,i)=>{
    let cls = 'pin-dot';
    if(err) cls+=' err'; else if(i<pinEntry.length) cls+=' filled';
    return `<span class="${cls}"></span>`;
  }).join('');
}
function checkPin(){
  if(pinEntry === pinTargetStaff.pin){
    currentStaff = pinTargetStaff;
    sessionStorage.setItem(SESSION_STAFF_KEY, JSON.stringify(currentStaff));
    document.getElementById('pinOverlay').classList.add('hidden');
    enterApp();
  }else{
    renderPinDots(true);
    setTimeout(()=>{ pinEntry=''; renderPinDots(); }, 450);
  }
}
document.getElementById('pinCancelBtn').addEventListener('click', ()=>{
  document.getElementById('pinOverlay').classList.add('hidden');
});

  document.getElementById('brandLogo').innerHTML = logoMarkup('logo-img');

  sw.innerHTML = types.map(ot=>`<button data-type="${ot.id}" class="${cart.orderType===ot.id?'active':''}">${t(ot.key)}</button>`).join('');

  });
  updateClock();
}
function updateClock(){
  document.getElementById('clock').textContent = formatTime(Date.now());
}

function setOrderType(type){
  if(type==='dine-in' && !cart.table){
    currentView='tables';
    cart.orderType='dine-in'; saveCart();
    renderAll();
    showToast(t('toast_choose_table'));
    return;
  }
  if(type!=='dine-in' && cart.table){
    freeTable(cart.table);
    cart.table = null;
  }
  cart.orderType = type; saveCart(); renderAll();
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}
function openModal(html, wide){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal-box ${wide?'wide':''}">${html}</div>
    </div>`;
  document.getElementById('ov').addEventListener('click', e=>{
    if(e.target.id==='ov') closeModal();
  });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function renderAll(){
  if(!hasAccess(currentView)) currentView='pos';
  renderNav();
  renderTopbar();
  const root = document.getElementById('view-root');
  if(currentView==='pos') root.innerHTML = renderPOS();
  else if(currentView==='tables') root.innerHTML = renderTables();
  else if(currentView==='orders') root.innerHTML = renderOrders();
  else if(currentView==='reports') root.innerHTML = renderReports();
  else if(currentView==='menu') root.innerHTML = renderMenu();
  else if(currentView==='inventory') root.innerHTML = renderInventory();
  else if(currentView==='staff') root.innerHTML = renderStaffView();
  else if(currentView==='settings') root.innerHTML = renderSettings();
  attachViewHandlers();

function renderCartItem(it){
  const mods = [L(it.size), L(it.milk), L(it.sugar), it.shots?`+${it.shots} ${t('shot_word')}`:'', (it.syrup&&it.syrup!=='بدون')?L(it.syrup):'']
    .filter(Boolean).join(' · ');
  return `
  <div class="cart-item" data-uid="${it.uid}">
    <div class="cart-item-top">
      <span class="cart-item-name">${it.icon||''} ${L(it.name)}</span>
      <button class="cart-item-remove" data-remove="${it.uid}">${t('remove_btn')}</button>
    </div>
    ${mods?`<div class="cart-item-mods">${mods}</div>`:''}
    ${it.note?`<div class="cart-item-mods">${t('note_prefix')}: ${it.note}</div>`:''}
    <div class="cart-item-bottom">
      <div class="qty-stepper">
        <button data-dec="${it.uid}">−</button><span>${it.qty}</span><button data-inc="${it.uid}">+</button>
      </div>
      <span class="cart-item-price">${fmt(it.unitPrice*it.qty)}</span>
    </div>
  </div>`;
}
function cartSubtotal(){ return money(cart.items.reduce((a,i)=>a+i.unitPrice*i.qty,0)); }
function effectiveDiscount(){
  if(cart.discount && cart.discount.value>0) return cart.discount;
  const S = state.settings;
  if(S.globalDiscountEnabled && S.globalDiscountValue>0){
    return {type:S.globalDiscountType||'percent', value:S.globalDiscountValue, reason:t('global_discount_reason'), isGlobal:true};
  }
  return cart.discount;
}
function cartDiscountAmount(subtotal){
  subtotal = subtotal!==undefined?subtotal:cartSubtotal();
  if(state.settings.discountEnabled===false) return 0;
  const d = effectiveDiscount();
  if(!d.value) return 0;
  if(d.type==='percent') return money(subtotal * (d.value/100));
  return money(Math.min(d.value, subtotal));
}

/* ---- cart mutations ---- */
function findCartMatch(cfg){
  return cart.items.find(i=> i.productId===cfg.productId && i.size===cfg.size && i.milk===cfg.milk &&
    i.sugar===cfg.sugar && i.shots===cfg.shots && i.syrup===cfg.syrup && i.note===cfg.note);
}
function addToCart(cfg){
  const existing = findCartMatch(cfg);
  if(existing){ existing.qty += cfg.qty; }
  else { cart.items.push(Object.assign({uid:uid()}, cfg)); }
  saveCart(); renderAll();
  showToast(t('toast_added_cart'));
}
function changeQty(uidVal, delta){
  const it = cart.items.find(i=>i.uid===uidVal); if(!it) return;
  it.qty += delta;
  if(it.qty<=0) cart.items = cart.items.filter(i=>i.uid!==uidVal);
  saveCart(); renderAll();
}
function removeCartItem(uidVal){
  cart.items = cart.items.filter(i=>i.uid!==uidVal);
  saveCart(); renderAll();
}
function clearCartConfirmed(){
  if(cart.table){ freeTable(cart.table); }
  cart = freshCart(); saveCart(); renderAll();
}

function resolveMods(product){
  const cat = state.categories.find(c=>c.id===product.cat);
  return Object.assign({}, cat.mods, product.mods||{});
}
function productHasAnyMods(product){
  const m = resolveMods(product);
  return m.size||m.milk||m.sugar||m.shot||m.syrup;
}

function openProduct(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p || !p.available) return;
  if(!productHasAnyMods(p)){
    addToCart({productId:p.id, name:p.name, icon:p.icon, size:'', milk:'', sugar:'', shots:0, syrup:'', note:'', qty:1, unitPrice:p.price});
    return;
  }
  openCustomizeModal(p);
}
function openCustomizeModal(p){
  const mods = resolveMods(p);
  const S = state.settings;
  let sel = {
    size: mods.size ? S.sizePrices[1].name : '',
    milk: mods.milk ? S.milkOptions[0].name : '',
    sugar: mods.sugar ? S.sugarLevels[2] : '',
    shots: 0,
    syrup: mods.syrup ? S.syrupOptions[0].name : '',
    qty: 1,
    note: ''
  };
  function unitPrice(){
    let price = p.price;
    if(mods.size) price += (S.sizePrices.find(s=>s.name===sel.size)||{diff:0}).diff;
    if(mods.milk) price += (S.milkOptions.find(m=>m.name===sel.milk)||{diff:0}).diff;
    if(mods.syrup) price += (S.syrupOptions.find(s=>s.name===sel.syrup)||{diff:0}).diff;
    if(mods.shot) price += sel.shots * S.extraShotPrice;
    return money(price);
  }
  function html(){
    return `
    <div class="modal-head"><span class="modal-title">${p.icon} ${L(p.name)}</span><button class="modal-close" id="mClose">✕</button></div>
    <div class="modal-body">
      ${mods.size?`<div class="modal-section"><div class="modal-section-title">${t('customize_size')}</div><div class="chip-row">${S.sizePrices.map(s=>`<button class="chip ${sel.size===s.name?'active':''}" data-act="size" data-v="${s.name}">${L(s.name)} ${s.diff?(s.diff>0?'+':'')+s.diff:''}</button>`).join('')}</div></div>`:''}
      ${mods.milk?`<div class="modal-section"><div class="modal-section-title">${t('customize_milk')}</div><div class="chip-row">${S.milkOptions.map(m=>`<button class="chip ${sel.milk===m.name?'active':''}" data-act="milk" data-v="${m.name}">${L(m.name)} ${m.diff?'+'+m.diff:''}</button>`).join('')}</div></div>`:''}
      ${mods.sugar?`<div class="modal-section"><div class="modal-section-title">${t('customize_sugar')}</div><div class="chip-row">${S.sugarLevels.map(s=>`<button class="chip ${sel.sugar===s?'active':''}" data-act="sugar" data-v="${s}">${L(s)}</button>`).join('')}</div></div>`:''}
      ${mods.syrup?`<div class="modal-section"><div class="modal-section-title">${t('customize_syrup')}</div><div class="chip-row">${S.syrupOptions.map(s=>`<button class="chip ${sel.syrup===s.name?'active':''}" data-act="syrup" data-v="${s.name}">${L(s.name)} ${s.diff?'+'+s.diff:''}</button>`).join('')}</div></div>`:''}
      ${mods.shot?`<div class="modal-section"><div class="modal-section-title">${t('customize_shot')} (+${S.extraShotPrice} ${t('per_shot')})</div>
        <div class="qty-big"><button data-act="shotdec">−</button><span id="shotVal">${sel.shots}</span><button data-act="shotinc">+</button></div></div>`:''}
      <div class="modal-section">
        <div class="modal-section-title">${t('qty_label')}</div>
        <div class="qty-big"><button data-act="qdec">−</button><span id="qtyVal">${sel.qty}</span><button data-act="qinc">+</button></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">${t('note_optional')}</div>
        <textarea id="noteInput" rows="2" placeholder="${t('note_placeholder')}">${sel.note}</textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-accent btn-lg" id="addBtn">${t('add_to_cart_btn')} · ${fmt(unitPrice()*sel.qty)}</button>
    </div>`;
  }
  openModal(html());
  bindModal();
  function bindModal(){
    document.getElementById('mClose').onclick = closeModal;
    document.getElementById('noteInput').oninput = e=>{ sel.note = e.target.value; };
    document.getElementById('addBtn').onclick = ()=>{
      addToCart({productId:p.id, name:p.name, icon:p.icon, size:sel.size, milk:sel.milk, sugar:sel.sugar, shots:sel.shots, syrup:sel.syrup, note:sel.note, qty:sel.qty, unitPrice:unitPrice()});
      closeModal();
    };
    document.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const act=b.dataset.act, v=b.dataset.v;
        if(act==='size') sel.size=v;
        else if(act==='milk') sel.milk=v;
        else if(act==='sugar') sel.sugar=v;
        else if(act==='syrup') sel.syrup=v;
        else if(act==='shotinc') sel.shots++;
        else if(act==='shotdec') sel.shots=Math.max(0,sel.shots-1);
        else if(act==='qinc') sel.qty++;
        else if(act==='qdec') sel.qty=Math.max(1,sel.qty-1);
        const noteVal = sel.note;
        openModal(html()); bindModal();
      });
    });
  }
}

/* discount modal */
function openDiscountModal(){
  const subtotal = cartSubtotal();
  const ed = effectiveDiscount();
  let type = ed.type, value = ed.value, reason = (ed.isGlobal?'':ed.reason);
  function computePreview(){
    const discountAmt = type==='percent' ? money(subtotal*((value||0)/100)) : money(Math.min(value||0, subtotal));
    const taxable = Math.max(0, subtotal - discountAmt);
    const tax = money(taxable*(state.settings.taxRate/100));
    const newTotal = money(taxable + tax);
    return {discountAmt, newTotal};
  }
  function updatePreview(){
    const {discountAmt, newTotal} = computePreview();
    document.getElementById('discAmtPreview').textContent = '-' + fmt(discountAmt);
    document.getElementById('discTotalPreview').textContent = fmt(newTotal);
  }
  function html(){
    const beforeTotal = money(subtotal*(1+state.settings.taxRate/100));
    const {discountAmt, newTotal} = computePreview();
    return `
    <div class="modal-head"><span class="modal-title">${t('discount_modal_title')}</span><button class="modal-close" id="mClose">✕</button></div>
    <div class="modal-body">
      <div class="chip-row" style="margin-bottom:14px;">
        <button class="chip ${type==='percent'?'active':''}" data-t="percent">${t('discount_type_percent')}</button>
        <button class="chip ${type==='fixed'?'active':''}" data-t="fixed">${t('discount_type_fixed')}</button>
      </div>
      ${type==='percent'?`
      <div class="modal-section-title">${t('quick_percentages')}</div>
      <div class="chip-row" style="margin-bottom:14px;">
        ${(state.settings.discountPresets&&state.settings.discountPresets.length?state.settings.discountPresets:[10,15,20,25,50]).map(p=>`<button class="chip ${value===p?'active':''}" data-preset-pct="${p}">${p}%</button>`).join('')}
      </div>`:''}
      <div class="form-row"><label>${type==='percent'?t('discount_percent_label'):t('discount_amount_label')+' ('+state.settings.currency+')'}</label>
        <input type="number" min="0" id="discVal" value="${value||''}"></div>
      <div class="form-row"><label>${t('discount_reason_label')}</label><input id="discReason" value="${reason||''}" placeholder="${t('discount_reason_placeholder')}"></div>
      <div class="card" style="background:var(--card2);padding:14px;">
        <div class="sum-row"><span>${t('before_discount_total')}</span><span>${fmt(beforeTotal)}</span></div>
        <div class="sum-row"><span>${t('discount_amount_value_label')}</span><span id="discAmtPreview" style="color:var(--danger);">-${fmt(discountAmt)}</span></div>
        <div class="sum-row total"><span>${t('after_discount_total')}</span><span id="discTotalPreview">${fmt(newTotal)}</span></div>
      </div>
    </div>
    <div class="modal-foot">
      ${cart.discount.value>0?`<button class="btn btn-outline" id="removeDisc">${t('remove_discount_btn')}</button>`:''}
      <button class="btn btn-accent" id="applyDisc">${t('apply')}</button>
    </div>`;
  }
  openModal(html()); bind();
  function bind(){
    document.getElementById('mClose').onclick=closeModal;
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ type=b.dataset.t; openModal(html()); bind(); });
    document.querySelectorAll('[data-preset-pct]').forEach(b=>b.onclick=()=>{ value=parseFloat(b.dataset.presetPct); openModal(html()); bind(); });
    document.getElementById('discVal').oninput = e=>{ value = parseFloat(e.target.value)||0; updatePreview(); };
    document.getElementById('discReason').oninput = e=>{ reason = e.target.value; };
    const rm = document.getElementById('removeDisc'); if(rm) rm.onclick=()=>{
      cart.discount = {type:'percent',value:0,reason:''}; saveCart(); closeModal(); renderAll();
    };
    document.getElementById('applyDisc').onclick = ()=>{
      cart.discount = {type, value:value||0, reason};
      saveCart(); closeModal(); renderAll();
      showToast(t('toast_discount_applied'));
    };
  }
}

function holdCurrentOrder(){

  const held = {id:uid(), time:Date.now(), items:cart.items, orderType:cart.orderType, table:cart.table, customer:cart.customer, discount:cart.discount, note:cart.note};

function renderTables(){
  return `
  <div class="section-head"><div class="section-title">${t('tables_title')}</div></div>
  <div class="tables-grid">
    ${state.tables.map(tb=>`
      <button class="table-card ${tb.status}" data-table="${tb.num}">
        <div class="table-num">${tb.num}</div>
        <div class="table-status">${tb.status==='free'?t('table_free'):(tb.heldId?t('table_held'):t('table_occupied'))}</div>
      </button>`).join('')}
  </div>`;
}
function freeTable(num){
  const t = state.tables.find(t=>t.num===num);
  if(t){ t.status='free'; t.heldId=null; }
  save();
}
function selectTable(num){
  const t = state.tables.find(t=>t.num===num);
  if(!t) return;
  if(t.status==='occupied' && t.heldId){
    if(cart.items.length){ showToast(t('toast_hold_or_clear_first')); return; }
    const h = state.heldOrders.find(x=>x.id===t.heldId);
    if(h){
      cart = {items:h.items, orderType:h.orderType, table:h.table, customer:h.customer||{name:'',phone:''}, discount:h.discount, note:h.note||''};
      state.heldOrders = state.heldOrders.filter(x=>x.id!==h.id);
      t.heldId=null; save(); saveCart();
    }
    currentView='pos'; renderAll(); return;
  }
  if(t.status==='occupied' && !t.heldId){
    showToast(t('toast_table_busy'));
    return;
  }
  if(cart.table) freeTable(cart.table);
  t.status='occupied'; t.heldId=null; save();
  cart.orderType='dine-in'; cart.table=num; saveCart();
  currentView='pos'; renderAll();
}

  function html(){

    return `

      <div class="chip-row" style="margin-bottom:16px;">
        <button class="chip ${method==='cash'?'active':''}" data-m="cash">${t('pay_cash')}</button>
        <button class="chip ${method==='card'?'active':''}" data-m="card">${t('pay_card')}</button>
        <button class="chip ${method==='applepay'?'active':''}" data-m="applepay">${t('pay_applepay')}</button>
        <button class="chip ${method==='split'?'active':''}" data-m="split">${t('pay_split')}</button>
      </div>
      ${method==='cash'?`
        <div class="form-row"><label>${t('amount_received_label')}</label><input type="number" id="cashGiven" value="${cashGiven}"></div>
        <div class="chip-row" style="margin-bottom:10px;">
          ${[total, Math.ceil(total/10)*10, Math.ceil(total/50)*50, Math.ceil(total/100)*100].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<button class="chip" data-preset="${v}">${fmt(v)}</button>`).join('')}
        </div>
        <div class="sum-row ${change<0?'':''}" style="font-weight:800;color:${change<0?'var(--danger)':'var(--success)'}">
          <span>${change<0?t('insufficient_amount'):t('change_due')}</span><span>${fmt(Math.abs(change))}</span>
        </div>`:''}
      ${method==='split'?`
        <div class="form-row"><label>${t('label_cash')}</label><input type="number" id="splitCashInp" value="${splitCash}"></div>
        <div class="form-row"><label>${t('label_card')}</label><input type="number" id="splitCardInp" value="${splitCard}"></div>
        <div style="font-size:.82rem;color:var(--muted);">${t('split_total_note')}: ${fmt(splitCash+splitCard)} (${t('must_equal_note')} ${fmt(total)})</div>
      `:''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="cancelPay">${t('cancel')}</button>
      <button class="btn btn-accent btn-lg" id="confirmPay">${t('confirm_payment_btn')}</button>
    </div>`;
  }
  openModal(html()); bind();
  function bind(){
    document.getElementById('mClose').onclick=closeModal;
    document.getElementById('cancelPay').onclick=closeModal;
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ method=b.dataset.m; openModal(html()); bind(); });
    const cg = document.getElementById('cashGiven');
    if(cg) cg.oninput=e=>{ cashGiven=parseFloat(e.target.value)||0; openModal(html()); bind(); document.getElementById('cashGiven').focus(); };
    document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ cashGiven=parseFloat(b.dataset.preset); openModal(html()); bind(); });
    const sc = document.getElementById('splitCashInp'), sk = document.getElementById('splitCardInp');
    if(sc) sc.oninput = e=>{ splitCash=parseFloat(e.target.value)||0; };
    if(sk) sk.oninput = e=>{ splitCard=parseFloat(e.target.value)||0; };
    document.getElementById('confirmPay').onclick=()=>{
      if(method==='cash' && cashGiven<total){ showToast(t('toast_cash_insufficient')); return; }
      if(method==='split' && Math.abs((splitCash+splitCard)-total)>0.01){ showToast(t('toast_split_mismatch')); return; }
      const payment = {method, total,
        cashGiven: method==='cash'?cashGiven:(method==='split'?splitCash:0),
        change: method==='cash'?money(cashGiven-total):0,
        splitCard: method==='split'?splitCard:0
      };
      finalizeOrder({subtotal, discount, tax, total, payment});
    };
  }
}

function deductInventory(order){
  order.items.forEach(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    if(p && p.recipe && p.recipe.length){
      p.recipe.forEach(r=>{
        const mat = state.inventory.find(m=>m.id===r.m);
        if(mat) mat.qty = money(mat.qty - r.qty*it.qty);
      });
    }
  });
}
function restockInventory(order){
  order.items.forEach(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    if(p && p.recipe && p.recipe.length){
      p.recipe.forEach(r=>{
        const mat = state.inventory.find(m=>m.id===r.m);
        if(mat) mat.qty = money(mat.qty + r.qty*it.qty);
      });
    }
  });
}

let lastOrder = null;
function finalizeOrder({subtotal, discount, tax, total, payment}){
  const order = {
    id: state.nextOrderNumber++,
    time: Date.now(),
    staffId: currentStaff.id, staffName: currentStaff.name,
    type: cart.orderType, table: cart.table, customer: Object.assign({},cart.customer),
    items: clone(cart.items),
    subtotal, discount: Object.assign({},effectiveDiscount(),{amount:discount}), tax, total,
    payment, status:'completed', note: cart.note
  };
  state.orders.unshift(order);
  deductInventory(order);
  if(cart.table) freeTable(cart.table);
  save();
  cart = freshCart(); saveCart();
  lastOrder = order;
  renderAll();
  openReceiptModal(order);
}

function computeStats(orders){
  const completed = orders.filter(o=>o.status==='completed');
  const totalSales = money(completed.reduce((a,o)=>a+o.total,0));
  const count = completed.length;
  const avg = count? money(totalSales/count) : 0;
  const byProduct = {};
  const byCategory = {};
  const byPayment = {};
  const byHour = {};
  completed.forEach(o=>{
    byPayment[o.payment.method] = (byPayment[o.payment.method]||0) + o.total;
    const h = new Date(o.time).getHours();
    byHour[h] = (byHour[h]||0) + o.total;
    o.items.forEach(it=>{
      byProduct[it.name] = byProduct[it.name] || {qty:0, revenue:0};
      byProduct[it.name].qty += it.qty;
      byProduct[it.name].revenue += it.unitPrice*it.qty;
      const p = state.products.find(x=>x.id===it.productId);
      const catName = p ? (state.categories.find(c=>c.id===p.cat)||{}).name : t('other_category');
      byCategory[catName] = (byCategory[catName]||0) + it.unitPrice*it.qty;
    });
  });
  return {totalSales, count, avg, byProduct, byCategory, byPayment, byHour};
}

function handleLogoUpload(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast(t('toast_pick_image')); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 240;
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; }
        else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.settings.logoImage = canvas.toDataURL('image/png');
      save(); renderAll();
      showToast(t('toast_logo_uploaded'));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function saveSettingsForm(){
  const S = state.settings;
  S.shopName = document.getElementById('setShopName').value || S.shopName;
  S.logo = document.getElementById('setLogo').value || S.logo;
  S.address = document.getElementById('setAddress').value;
  S.phone = document.getElementById('setPhone').value;
  S.receiptFooter = document.getElementById('setFooter').value;
  const currencySel = document.getElementById('setCurrency').value;
  S.currency = currencySel==='__other__' ? (document.getElementById('setCurrencyCustom').value || S.currency) : currencySel;
  S.taxRate = parseFloat(document.getElementById('setTax').value)||0;
  S.extraShotPrice = parseFloat(document.getElementById('setShotPrice').value)||0;
  S.discountEnabled = document.getElementById('setDiscountEnabled').checked;
  if(!S.discountEnabled){ cart.discount = {type:'percent',value:0,reason:''}; saveCart(); }
  const presets = document.getElementById('setDiscountPresets').value
    .split(',').map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v) && v>0 && v<=100);
  S.discountPresets = presets.length ? [...new Set(presets)].sort((a,b)=>a-b) : [10,15,20,25,50];
  S.globalDiscountEnabled = document.getElementById('setGlobalDiscountEnabled').checked;
  const activeGdType = document.querySelector('[data-gd-type].active');
  S.globalDiscountType = activeGdType ? activeGdType.dataset.gdType : 'percent';
  S.globalDiscountValue = parseFloat(document.getElementById('setGlobalDiscountValue').value)||0;
  S.branchName = document.getElementById('setBranchName').value;
  S.branchLocation = document.getElementById('setBranchLocation').value;
  const newCount = parseInt(document.getElementById('setTables').value)||S.tablesCount;
  if(newCount !== S.tablesCount){
    if(newCount > state.tables.length){
      for(let i=state.tables.length+1;i<=newCount;i++) state.tables.push({num:i,status:'free',heldId:null});
    } else {
      state.tables = state.tables.slice(0,newCount);
    }
    S.tablesCount = newCount;
  }
  save(); renderAll();
  showToast(t('toast_settings_saved'));
}

/* ============================================================
   EVENT DELEGATION per view
   ============================================================ */
function attachViewHandlers(){
  const root = document.getElementById('view-root');

  // POS
  root.querySelectorAll('.cat-tab').forEach(b=>b.addEventListener('click', ()=>{ currentCategory=b.dataset.cat; renderAll(); }));
  const search = root.querySelector('#posSearch');
  if(search){
    search.addEventListener('input', e=>{
      const q = e.target.value.trim();
      const grid = document.getElementById('productGrid');
      const prods = q ? state.products.filter(p=>p.name.includes(q)) : state.products.filter(p=>p.cat===currentCategory);
      grid.innerHTML = renderProductCards(prods);
      bindProductCards();
    });
  }
  bindProductCards();
  function bindProductCards(){
    document.querySelectorAll('[data-product]').forEach(b=>b.addEventListener('click', ()=>openProduct(b.dataset.product)));
  }
  root.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.inc, 1)));
  root.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.dec, -1)));
  root.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>removeCartItem(b.dataset.remove)));
  const discountBtn = root.querySelector('#discountBtn'); if(discountBtn) discountBtn.addEventListener('click', openDiscountModal);
  const heldBtn = root.querySelector('#heldOrdersBtn'); if(heldBtn) heldBtn.addEventListener('click', openHeldOrdersModal);
  const custBtn = root.querySelector('#custBtn'); if(custBtn) custBtn.addEventListener('click', openCustomerModal);
  const clearBtn = root.querySelector('#clearCartBtn'); if(clearBtn) clearBtn.addEventListener('click', ()=>{
    if(confirm(t('confirm_clear_cart'))) clearCartConfirmed();
  });
  const holdBtn = root.querySelector('#holdBtn'); if(holdBtn) holdBtn.addEventListener('click', holdCurrentOrder);
  const checkoutBtn = root.querySelector('#checkoutBtn'); if(checkoutBtn) checkoutBtn.addEventListener('click', openCheckoutModal);

  // Tables
  root.querySelectorAll('[data-table]').forEach(b=>b.addEventListener('click', ()=>selectTable(parseInt(b.dataset.table))));

  // Orders
  root.querySelectorAll('[data-of]').forEach(b=>b.addEventListener('click', ()=>{ ordersFilter=b.dataset.of; renderAll(); }));
  const oSearch = root.querySelector('#ordersSearchInp');
  if(oSearch) oSearch.addEventListener('input', e=>{ ordersSearch=e.target.value; renderAll(); });
  root.querySelectorAll('[data-view-order]').forEach(b=>b.addEventListener('click', ()=>{
    const o = state.orders.find(x=>x.id===parseInt(b.dataset.viewOrder));
    if(o) openReceiptModal(o);
  }));
  root.querySelectorAll('[data-void-order]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm(t('confirm_void_order'))) voidOrder(parseInt(b.dataset.voidOrder));
  }));

  // Reports
  root.querySelectorAll('[data-rt]').forEach(b=>b.addEventListener('click', ()=>{ reportsTab=b.dataset.rt; renderAll(); }));
  const applyRange = root.querySelector('#applyRange');
  if(applyRange) applyRange.addEventListener('click', ()=>{
    window._reportRange = {from:document.getElementById('repFrom').value, to:document.getElementById('repTo').value};
    renderAll();
  });
  const printRep = root.querySelector('#printReport');
  if(printRep) printRep.addEventListener('click', ()=>{ window.print(); });

  // Menu
  const addCatBtn = root.querySelector('#addCatBtn'); if(addCatBtn) addCatBtn.addEventListener('click', ()=>openCategoryModal());
  const addProdBtn = root.querySelector('#addProdBtn'); if(addProdBtn) addProdBtn.addEventListener('click', ()=>openProductModal());
  root.querySelectorAll('[data-edit-cat]').forEach(b=>b.addEventListener('click', ()=>openCategoryModal(state.categories.find(c=>c.id===b.dataset.editCat))));
  root.querySelectorAll('[data-edit-prod]').forEach(b=>b.addEventListener('click', ()=>openProductModal(state.products.find(p=>p.id===b.dataset.editProd))));

  // Inventory
  const addMatBtn = root.querySelector('#addMatBtn'); if(addMatBtn) addMatBtn.addEventListener('click', openMaterialModal);
  root.querySelectorAll('[data-mat-inc]').forEach(b=>b.addEventListener('click', ()=>{
    const m = state.inventory.find(x=>x.id===b.dataset.matInc); m.qty = money(m.qty+m.step); save(); renderAll();
  }));
  root.querySelectorAll('[data-mat-dec]').forEach(b=>b.addEventListener('click', ()=>{
    const m = state.inventory.find(x=>x.id===b.dataset.matDec); m.qty = money(Math.max(0,m.qty-m.step)); save(); renderAll();
  }));
  root.querySelectorAll('[data-mat-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm(t('confirm_delete_material'))){ state.inventory = state.inventory.filter(x=>x.id!==b.dataset.matDel); save(); renderAll(); }
  }));

  // Staff
  const addStaffBtn = root.querySelector('#addStaffBtn'); if(addStaffBtn) addStaffBtn.addEventListener('click', ()=>openStaffModal());
  root.querySelectorAll('[data-edit-staff]').forEach(b=>b.addEventListener('click', ()=>openStaffModal(state.staff.find(s=>s.id===b.dataset.editStaff))));
  root.querySelectorAll('[data-del-staff]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm(t('confirm_delete_staff'))){ state.staff = state.staff.filter(s=>s.id!==b.dataset.delStaff); save(); renderAll(); }
  }));

  // Settings
  const logoFile = root.querySelector('#setLogoFile');
  if(logoFile) logoFile.addEventListener('change', e=>{ handleLogoUpload(e.target.files[0]); });
  const removeLogoBtn = root.querySelector('#removeLogoBtn');
  if(removeLogoBtn) removeLogoBtn.addEventListener('click', ()=>{
    state.settings.logoImage=''; save(); renderAll();
  });
  const curSelect = root.querySelector('#setCurrency');
  if(curSelect) curSelect.addEventListener('change', ()=>{
    const wrap = root.querySelector('#setCurrencyCustomWrap');
    if(wrap) wrap.style.display = curSelect.value==='__other__' ? '' : 'none';
  });
  root.querySelectorAll('[data-tax-preset]').forEach(b=>b.addEventListener('click', ()=>{
    document.getElementById('setTax').value = b.dataset.taxPreset;
    root.querySelectorAll('[data-tax-preset]').forEach(x=>x.classList.toggle('active', x===b));
  }));
  root.querySelectorAll('[data-gd-type]').forEach(b=>b.addEventListener('click', ()=>{
    root.querySelectorAll('[data-gd-type]').forEach(x=>x.classList.toggle('active', x===b));
    const lbl = document.getElementById('globalDiscountValueLabel');
    lbl.textContent = b.dataset.gdType==='percent' ? t('discount_percent_label') : t('discount_amount_label')+' ('+state.settings.currency+')';
  }));
  root.querySelectorAll('[data-storage]').forEach(b=>b.addEventListener('click', ()=>{
    state.settings.storageMode = b.dataset.storage;
    save();
    showToast(b.dataset.storage==='cloud' ? t('toast_storage_cloud') : t('toast_storage_local'));
    root.querySelectorAll('[data-storage]').forEach(x=>x.classList.toggle('active', x.dataset.storage===b.dataset.storage));
  }));
  root.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click', ()=>{
    state.settings.language = b.dataset.lang;
    save(); applyDocDir(); renderAll();
  }));
  const saveSettingsBtn = root.querySelector('#saveSettingsBtn'); if(saveSettingsBtn) saveSettingsBtn.addEventListener('click', saveSettingsForm);
  const resetBtn = root.querySelector('#resetDataBtn'); if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(confirm(t('confirm_reset_data'))){
      state = clone(DEFAULT_DATA); save();
      cart = freshCart(); saveCart();
      renderAll();
    }
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function renderLoginBrand(){
  applyDocDir();
  document.getElementById('loginLogo').innerHTML = logoMarkup('login-logo-img');
  document.getElementById('loginTitle').textContent = state.settings.shopName;
  document.getElementById('loginSub').textContent = (state.settings.branchName ? L(state.settings.branchName) + ' — ' : '') + t('login_subtitle');
  document.getElementById('pinPrompt').textContent = t('pin_prompt');
  document.getElementById('pinCancelBtn').textContent = t('cancel');
}
renderLoginBrand();
if(currentStaff){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  currentView = hasAccess('pos') ? 'pos' : 'orders';
  renderAll();
}else{
  renderStaffGrid();
}
</script>
</body>
</html>
